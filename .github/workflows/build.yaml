name: Build

on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Game Crane
        uses: yeslayla/setup-game-crane@main
        with:
          token: ${{ secrets.CRANE_TOKEN }}

      - name: Setup
        run: game-crane setup

      - name: Build
        run: game-crane build:all
        env:
          BUILD_TYPE: Release

      - name: Package
        run: game-crane package:all

      - name: Publish artifact
        run: game-crane publish:release
